<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Campus Local Marketplace</title>
        <!--link to css file-->
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>
            <h1>Campus Local Marketplace</h1>

            <nav>
                <!--simple front-end switch-->
                <label for="role-switch">Log in as:</label>
                <select id="role-switch">
                    <option value="visitor">Visitor</option>
                    <option value="member">Member</option>
                    <option value="moderator">Moderator</option>
                </select>
            </nav>
        </header>

        <main id="app-content">
            <section id="grid-view">
                <h2>Available Items</h2>

                <!--search and filter-->
                <div class="controls">
                    <label for="search-input">Search:</label>
                    <input type="text" id="search-input" placeholder="Search Keywords...">

                    <label for="category-filter">Category:</label>
                    <select id="category-filter" name="category-filter">
                        <option value="all">All Categories</option>
                        <option value="textbooks">Textbooks</option>
                        <option value="furniture">Furniture</option>
                        <option value="electronics">Electronics</option>
                    </select>
                </div>

                <!--actual grid-->
                <div id="listings-grid">
                    <!--item listings will be injected by JS here later-->
                </div>
            </section>

            <!--creating new listing-->
            <section id="create-view">
                <h2>Post a New Item</h2>

                <form id="create-listing-form">
                    <div>
                        <label for="item-title">Title:</label>
                        <input type="text" id="item-title" name="item-title" required>
                    </div>

                    <div>
                        <label for="item-category">Category:</label>
                        <select id="item-category" name="item-category" required>
                            <option value="">-- Select a Category --</option>
                            <option value="textbooks">Textbooks</option>
                            <option value="furniture">Furniture</option>
                            <option value="electronics">Electronics</option>
                        </select>
                    </div>

                    <div>
                        <label for="item-desc">Description:</label>
                        <textarea id="item-desc" name="item-desc" rows="4" required></textarea>
                    </div>

                    <button type="submit">Submit Listing</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Local Marketplace</p>
        </footer>

        <!--jQuery library-->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <!--link to own custom JS logic-->
        <script src="js/app.js""></script>
    </body>
</html>
